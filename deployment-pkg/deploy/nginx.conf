# =============================================================================
# Nginx configuration for HR Autonomous OS
# Deployment: hr.example.com + *.hr.example.com (or your custom HR domain)
# Backend listens on: 127.0.0.1:8010
# SSL: Terminated at your proxy (Cloudflare/LE) — Nginx uses plain HTTP upstream
# =============================================================================

# Rate limiting zone (protect API endpoints)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# -----------------------------------------------------------------------
# Redirect bare HTTP requests to HTTPS (Cloudflare handles actual TLS)
# -----------------------------------------------------------------------
server {
    listen 80;
    server_name hr.example.com *.hr.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------
# Main HTTPS vhost — wildcard subdomain + apex
# -----------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name hr.example.com *.hr.example.com;

    # ---- SSL certificates (Cloudflare Origin Certificate recommended) ----
    ssl_certificate     /etc/ssl/hr.example.com/cert.pem;
    ssl_certificate_key /etc/ssl/hr.example.com/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- Proxy to FastAPI backend ----
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;

        # Forward real client IP (Cloudflare sets CF-Connecting-IP)
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Tenant          $subdomain;

        proxy_read_timeout  120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout  120s;

        # WebSocket support (for future real-time features)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Health check — no rate limit ----
    location = /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Static files (if served separately in future) ----
    # location /static/ {
    #     alias /srv/autonomous/static/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # ---- Deny hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log  /var/log/nginx/hr-autonomous.access.log;
    error_log   /var/log/nginx/hr-autonomous.error.log warn;
}

# -----------------------------------------------------------------------
# Subdomain extraction map (used for X-Tenant header)
# Place this in the http{} block of /etc/nginx/nginx.conf or include it
# -----------------------------------------------------------------------
